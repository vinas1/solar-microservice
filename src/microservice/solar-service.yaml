apiVersion: apps/v1
kind: Deployment
metadata:
  name: solar-service
  namespace: default
  labels:
    app: solar-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solar-service
  template:
    metadata:
      labels:
        app: solar-service
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: solar-service
        image: ghcr.io/vinas1/solar-service:v1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: solar-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: solar-service
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500